[project]
name = "jarvis"
version = "0.1.0"
description = "Kişisel asistan: not, hatırlatıcı, harcama, sağlık kaydı, günlük/haftalık özet"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
